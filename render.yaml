# Despliegue en Render — configuración de PLAN GRATUITO.
#
# El plan gratuito NO incluye Background Workers ni discos persistentes, así que
# el worker corre embebido dentro de la API (WORKER_EMBEBIDO=true) como tarea
# asyncio. Limitación conocida: el servicio se duerme tras ~15 min sin tráfico
# y el loop se detiene con él. Se compensa con un ping externo — ver README.
#
# Este archivo debe vivir en la RAÍZ del repo: Render solo busca render.yaml ahí.
# El servicio apunta a backend/ mediante rootDir.
#
# Ver: Segundo Cerebro/01 - Arquitectura/Arquitectura de despliegue y pipeline asincrono.md

services:
  - type: web
    name: induccion-hslv-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: WORKER_EMBEBIDO
        value: "true"
      - key: CAMPANA
        value: "2026"
      # Secretos: se cargan a mano en el panel, nunca en este archivo.
      - key: DATABASE_URL
        sync: false
      - key: CLAVE_DATOS
        sync: false
      - key: PEPPER_CEDULA
        sync: false
      - key: ORIGENES
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

# Cuando haya presupuesto, el paso a producción es añadir aquí:
#
#   - type: worker
#     name: hslv-worker
#     plan: starter          # ~USD 7/mes
#     startCommand: python -m app.worker.run
#
# y poner WORKER_EMBEBIDO=false en el servicio web. El código ya soporta ambos
# modos sin cambios: es la misma función loop().
