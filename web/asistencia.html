<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Registro de asistencia — HSLV</title>
<link rel="icon" type="image/png" href="Assets/Logo/hslv-mark.png" />
<link rel="stylesheet" href="css/style.css?v=20260907b" />
<link rel="stylesheet" href="css/splash.css" />
</head>
<body>

<div id="splashScreen">
  <img class="splash-img" src="Assets/Logo/logo-unidad-ia.jpg" alt="Unidad de Inteligencia Artificial — Hospital Susana López de Valencia" />
  <div class="splash-loader-wrap">
    <div class="splash-loader-label">
      <span>Cargando</span>
      <span id="splashPercent">0%</span>
    </div>
    <div class="splash-loader-track">
      <div id="splashBar" class="splash-loader-bar"></div>
    </div>
  </div>
</div>

<div class="page">

  <img class="watermark" src="Assets/Logo/hslv-mark.png" alt="" aria-hidden="true" />

  <div class="topbar">
    <div class="mark"><img src="Assets/Logo/hslv.jpg" alt="" aria-hidden="true" /></div>
    <div class="wordmark">
      <div class="name">Hospital Susana López de Valencia E.S.E.</div>
      <div class="sub">Registro de asistencia</div>
      <div class="sub">Memoria, Huella e Identidad</div>
    </div>
  </div>

  <main>
    <div class="hero">
      <p class="eyebrow">Registro de asistencia</p>
      <h1>¡Hola!</h1>
      <p class="lede">Ingresa tu número de cédula para registrar tu asistencia.</p>
    </div>

    <form id="form-asistencia" autocomplete="off">
      <div class="field" id="grupo-cedula">
        <label for="cedula">Número de cédula</label>
        <input type="number" id="cedula" name="cedula" inputmode="numeric" autocomplete="new-password" required />
        <p class="hint">Sin puntos ni espacios.</p>
      </div>

      <button class="submit" type="submit" id="btn-cedula">Continuar</button>
      <p class="status" id="status" role="status"></p>
    </form>

    <!-- Aparece si la cédula no está en `personal`, o si está pero le falta
         correo o entidad — en ese caso se precarga con lo que ya se sabe y
         al enviarla reemplaza esos datos en `personal`. -->
    <form id="form-contacto" autocomplete="off" hidden>
      <div class="field">
        <label for="nombre">Nombre(s) y Apellidos</label>
        <input type="text" id="nombre" name="nombre" autocomplete="new-password" required />
      </div>

      <div class="field">
        <label for="correo">Correo electrónico</label>
        <input type="email" id="correo" name="correo" autocomplete="new-password" required />
      </div>

      <div class="field">
        <label for="telefono">Teléfono</label>
        <input type="tel" id="telefono" name="telefono" inputmode="numeric" autocomplete="new-password" required />
      </div>

      <div class="field">
        <label for="cargo">Cargo</label>
        <select id="cargo" name="cargo" autocomplete="off" required>
          <option value="" disabled selected>Selecciona tu cargo</option>
        </select>
        <input type="text" id="cargo-otra" name="cargo-otra" placeholder="Escribe tu cargo" autocomplete="off" hidden />
      </div>

      <div class="field">
        <label for="proceso">Proceso</label>
        <select id="proceso" name="proceso" autocomplete="off" required>
          <option value="" disabled selected>Selecciona tu proceso</option>
        </select>
        <input type="text" id="proceso-otra" name="proceso-otra" placeholder="Escribe tu proceso" autocomplete="off" hidden />
      </div>

      <div class="field">
        <label for="entidad">Entidad / Sindicato</label>
        <select id="entidad" name="entidad" autocomplete="off" required>
          <option value="" disabled selected>Selecciona tu entidad</option>
        </select>
        <input type="text" id="entidad-otra" name="entidad-otra" placeholder="Escribe tu entidad" autocomplete="off" hidden />
      </div>

      <button class="submit" type="submit">Continuar</button>
      <p class="status" id="status-contacto" role="status"></p>
    </form>
  </main>

</div>

<script src="js/asistencia.js?v=20260911a"></script>
<script src="js/splash.js"></script>
</body>
</html>
